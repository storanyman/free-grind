name: Build CachyOS PackageSSSS

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    name: Build Arch Package
    runs-on: ubuntu-24.04

    container:
      image: cachyos/cachyos:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            cmake \
            git \
            curl \
            wget \
            unzip \
            file \
            openssl \
            pkgconf \
            gtk3 \
            webkit2gtk-4.1 \
            libayatana-appindicator \
            librsvg \
            patchelf \
            nodejs \
            npm \
            rust \
            cargo \
            nasm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build Tauri application
        run: |
          bunx tauri build

      - name: Create PKGBUILD
        run: |
          mkdir -p pkg

          cp src-tauri/target/release/free-grind pkg/free-grind

          cp src-tauri/icons/32x32.png pkg/icon.png

          cat > pkg/PKGBUILD <<'EOF'
          pkgname=free-grind
          pkgver=0.5.4
          pkgrel=1
          pkgdesc="Free Grind desktop application"
          arch=('x86_64')
          url="https://github.com/storanyman/free-grind"
          license=('custom')

          depends=(
            'gtk3'
            'webkit2gtk-4.1'
            'libayatana-appindicator'
            'librsvg'
          )

          package() {
            install -Dm755 "$srcdir/free-grind" \
              "$pkgdir/usr/bin/free-grind"

            install -Dm644 "$srcdir/icon.png" \
              "$pkgdir/usr/share/icons/hicolor/32x32/apps/free-grind.png"

            install -Dm644 /dev/stdin \
              "$pkgdir/usr/share/applications/free-grind.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Free Grind
          Comment=Free Grind
          Exec=free-grind
          Icon=free-grind
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP
          }
          EOF

      - name: Build Arch package
        working-directory: pkg
        run: |
          makepkg --syncdeps --noconfirm

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-arch
          path: pkg/*.pkg.tar.zst
          if-no-files-found: error
